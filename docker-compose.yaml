services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Browser-side calls hit this URL directly, so it must be reachable
        # from the host/client machine, not just the frontend container -
        # e.g. the village-system-backend container's published host port.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:1323}
    container_name: village-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
